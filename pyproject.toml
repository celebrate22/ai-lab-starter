[project]
name = "ailab"
version = "0.1.0"
description = "Starter lab for AI Engineering from Scratch"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]